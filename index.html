<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhammad Gallant Sayyidurroyyan // Operator File</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --bg:#0c0e11; --panel:#14171b; --panel2:#1b1f24; --line:#2b3138;
  --text:#eef1f4; --mute:#8d97a2; --yellow:#ffe600; --cyan:#22e4ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background-color:var(--bg);color:var(--text);
  font:500 1.15rem/1.65 'Rajdhani',sans-serif;
  background-image:
    radial-gradient(900px 500px at 85% -5%,rgba(34,228,255,.08),transparent 60%),
    radial-gradient(700px 500px at 0 100%,rgba(255,230,0,.05),transparent 60%),
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:auto,auto,56px 56px,56px 56px;
  background-attachment:fixed;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}

/* Nomor seri / hiasan arsip */
.sn{font-size:.72rem;font-weight:600;letter-spacing:.16em;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}

/* NAV */
.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:.8rem clamp(1rem,4vw,3rem);background:rgba(12,14,17,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.8rem;font-weight:700;font-size:1rem;letter-spacing:.22em;text-transform:uppercase}
.brand i{width:16px;height:16px;background:var(--yellow);clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,30% 100%,0 70%)}
.nav ul{display:flex;gap:2rem;list-style:none}
.nav li a{position:relative;padding:.3rem 0;font-weight:600;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);transition:color .2s}
.nav li a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--yellow);transition:width .25s}
.nav li a:hover{color:var(--text)}
.nav li a:hover::after{width:100%}

/* PANEL SUDUT TERPOTONG */
.card,.skill{
  --cut:20px;position:relative;isolation:isolate;background:var(--line);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
}
.card::before,.skill::before{content:"";position:absolute;inset:1px;z-index:-1;clip-path:inherit;
  background:linear-gradient(135deg,var(--panel2),var(--panel) 65%);transition:background .25s}
.card{padding:2.6rem 2.2rem 2.8rem 2.4rem}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--yellow)}
.card.cy::after{background:var(--cyan)}
.card>.sn{position:absolute;right:calc(20px + .6rem);top:.7rem}
.card>.sn.bot{top:auto;bottom:.7rem;right:1.3rem}
.tag{display:block;margin-bottom:.8rem;font-size:.8rem;font-weight:700;letter-spacing:.28em;color:var(--yellow);text-transform:uppercase}
.cy .tag{color:var(--cyan)}
.card h3{margin-bottom:.7rem;font-size:1.45rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;line-height:1.25}
.card p{color:#c5cdd5}

/* TOMBOL */
.btn{
  --cut:14px;position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:.9rem;
  padding:.95rem 2.1rem;font-weight:700;font-size:1.05rem;letter-spacing:.22em;text-transform:uppercase;transition:color .25s;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));
}
.btn::before{content:"";position:absolute;inset:0;
